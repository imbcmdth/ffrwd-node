[package]
name = "ffrwd-node"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Write an ffrwd node module in Rust: a trait for the node, and the bindings, params, time and emission glue around it."
repository = "https://github.com/imbcmdth/ffrwd-node"

[lib]
name = "ffrwd_node"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.57.1"
